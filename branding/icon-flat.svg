<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- File Beaver small-size icon (16-48 px): a flat beaver face on the pond tile.
       Shapes are chunky on purpose so they survive 16 px. -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#0E3B24"/>
  <!-- ears -->
  <circle cx="17" cy="20" r="7" fill="#F1F6EE"/>
  <circle cx="47" cy="20" r="7" fill="#F1F6EE"/>
  <!-- head -->
  <ellipse cx="32" cy="35" rx="21" ry="19" fill="#F1F6EE"/>
  <!-- eyes and nose -->
  <circle cx="24" cy="31" r="2.8" fill="#0E3B24"/>
  <circle cx="40" cy="31" r="2.8" fill="#0E3B24"/>
  <ellipse cx="32" cy="38" rx="4" ry="3" fill="#0E3B24"/>
  <!-- the two front teeth, in lime so the beaver reads even at 16 px -->
  <rect x="26.5" y="42" width="5" height="8" rx="1.5" fill="#A6E43A"/>
  <rect x="32.5" y="42" width="5" height="8" rx="1.5" fill="#A6E43A"/>
</svg>
